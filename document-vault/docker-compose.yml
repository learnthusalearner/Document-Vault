services:
  postgres:
    image: postgres:16-alpine
    container_name: document_vault_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vault_secret}
      POSTGRES_DB: ${POSTGRES_DB:-document_vault}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vault} -d ${POSTGRES_DB:-document_vault}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
